services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiscalnorth
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d fiscalnorth']
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - '5672:5672'

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: fiscalnorth-backend
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fiscalnorth
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: 'true'
      SPRING_SQL_INIT_MODE: always
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_H2_CONSOLE_ENABLED: 'false'
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: myuser
      SPRING_RABBITMQ_PASSWORD: secret
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_AUTH_FRONTEND_URL: http://localhost:3000
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: fiscalnorth-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
