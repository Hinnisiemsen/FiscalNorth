<div class="page-content-inner">
  <app-page-header [heading]="'bankSync.title' | translate" />

  @if (showPremiumBanner) {
    <app-paywall-banner feature="BANK_SYNC" messageKey="billing.paywall.bankSync" />
  }

  <div
    class="card-glass status-card"
    *ngIf="status"
    [class.available]="status.available"
    [class.unavailable]="!status.available"
  >
    <p>{{ status.message }}</p>
  </div>

  <div class="error-message" *ngIf="error">
    <span class="material-symbols-outlined">error</span>
    {{ error }}
  </div>

  <div class="sync-actions" *ngIf="status?.available && !premiumBlocked">
    <button class="btn btn-primary" type="button" (click)="connectBank()" [disabled]="loading">
      {{ loading ? ('bankSync.connecting' | translate) : ('bankSync.connect' | translate) }}
    </button>
  </div>

  <section class="consents-section" *ngIf="consents.length > 0">
    <h3 class="section-title">{{ 'bankSync.consentsTitle' | translate }}</h3>
    <div class="list-card" *ngFor="let c of consents">
      <div class="list-card-body">
        <div class="list-card-title consent-id">{{ c.consentId }}</div>
        <div class="list-card-meta">
          <span class="chip" [class.valid]="c.status === 'VALID'">{{ c.status }}</span>
          <span *ngIf="c.validUntil">
            · {{ 'bankSync.validUntil' | translate: { date: c.validUntil } }}</span
          >
        </div>
      </div>
      <button
        *ngIf="c.status === 'VALID'"
        class="btn btn-secondary"
        type="button"
        (click)="sync(c.consentId)"
        [disabled]="loading"
      >
        {{ 'bankSync.sync' | translate }}
      </button>
    </div>
  </section>

  <p class="hint" *ngIf="!status?.available && status">
    {{ 'bankSync.configHint' | translate }}
  </p>
</div>
