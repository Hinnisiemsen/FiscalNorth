<div class="page-content-inner">
  <app-page-header [heading]="'budgets.newTitle' | translate" />

  <div class="form-container card-glass">
    <form [formGroup]="budgetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">{{ 'budgets.name' | translate }}</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="e.g. Groceries, Entertainment"
        />
      </div>
      <div class="form-group">
        <label for="limit">{{ 'budgets.limit' | translate }}</label>
        <input id="limit" type="number" formControlName="limit" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label for="categoryId">{{ 'budgets.categoryOptional' | translate }}</label>
        <select id="categoryId" formControlName="categoryId">
          <option [ngValue]="null">— {{ 'common.none' | translate }} —</option>
          <option *ngFor="let cat of expenseCategories" [ngValue]="cat.id">{{ cat.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="startDate">{{ 'budgets.startDate' | translate }}</label>
        <input id="startDate" type="date" formControlName="startDate" />
      </div>
      <div class="form-group">
        <label for="endDate">{{ 'budgets.endDate' | translate }}</label>
        <input id="endDate" type="date" formControlName="endDate" />
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          {{ 'budgets.cancel' | translate }}
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="budgetForm.invalid">
          {{ 'budgets.save' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
