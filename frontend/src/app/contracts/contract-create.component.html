<div class="page-content-inner">
  <app-page-header heading="New Contract" />

  <div class="form-container card-glass">
    <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. Rent, Gym">
      </div>
      <div class="form-group">
        <label for="amount">Amount (€)</label>
        <input id="amount" type="number" formControlName="amount" placeholder="0.00">
      </div>
      <div class="form-group">
        <label for="interval">Interval</label>
        <select id="interval" formControlName="contractInterval">
          <option value="MONTHLY">Monthly</option>
          <option value="QUARTERLY">Quarterly</option>
          <option value="YEARLY">Yearly</option>
        </select>
      </div>
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input id="startDate" type="date" formControlName="startDate">
      </div>
      <div class="form-group">
        <label for="endDate">End Date (Optional)</label>
        <input id="endDate" type="date" formControlName="endDate">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="contractForm.invalid">Save Contract</button>
      </div>
    </form>
  </div>
</div>
