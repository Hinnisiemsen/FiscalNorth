<div class="page-content-inner">
  <app-page-header heading="Contracts">
    <button class="btn btn-secondary" (click)="analyzeContracts()" [disabled]="isAnalyzing">
      {{ isAnalyzing ? 'Analyzing...' : 'Analyze Contracts' }}
    </button>
    <a routerLink="/contracts/new" class="btn btn-primary">Add Contract</a>
  </app-page-header>

  <div class="list-card" *ngFor="let contract of contracts">
    <div class="list-card-icon">
      <span class="material-symbols-outlined">description</span>
    </div>
    <div class="list-card-body">
      <div class="list-card-title">{{ contract.name }}</div>
      <div class="list-card-meta">{{ contract.contractInterval }}</div>
    </div>
    <span class="chip" *ngIf="contract.autoDetected">Auto</span>
    <div class="list-card-amount">{{ contract.amount | currency:'EUR' }}</div>
  </div>

  <div class="empty-state" *ngIf="contracts.length === 0">
    <p>No contracts found.</p>
  </div>
</div>
