<div class="page-content-inner">
  <app-page-header heading="New Transaction" />

  <div class="form-container card-glass">
    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="description">Description</label>
        <input id="description" type="text" formControlName="description" placeholder="e.g. Netflix, Rewe">
      </div>
      <div class="form-group">
        <label for="amount">Amount (€)</label>
        <input id="amount" type="number" formControlName="amount" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" type="date" formControlName="transactionDate">
      </div>
      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" formControlName="transactionType">
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
        </select>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" formControlName="categoryId">
          <option [ngValue]="null">— Select category (optional) —</option>
          <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="contract">Contract (optional)</label>
        <select id="contract" formControlName="contractId">
          <option [ngValue]="null">— None —</option>
          <option *ngFor="let c of contracts" [ngValue]="c.id">
            {{ c.name }} ({{ c.amount | currency:'EUR' }}/{{ c.contractInterval }})
          </option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="transactionForm.invalid">Save Transaction</button>
      </div>
    </form>
  </div>
</div>
