<div class="page-content-inner">
  <app-page-header [heading]="'transactions.newTitle' | translate" />

  <div class="form-container card-glass">
    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="description">{{ 'transactions.description' | translate }}</label>
        <input id="description" type="text" formControlName="description" />
      </div>
      <div class="form-group">
        <label for="amount">{{ 'transactions.amount' | translate }}</label>
        <input id="amount" type="number" formControlName="amount" step="0.01" />
      </div>
      <div class="form-group">
        <label for="date">{{ 'transactions.date' | translate }}</label>
        <input id="date" type="date" formControlName="transactionDate" />
      </div>
      <div class="form-group">
        <label for="type">{{ 'transactions.type' | translate }}</label>
        <select id="type" formControlName="transactionType">
          <option value="Expense">{{ 'transactions.expense' | translate }}</option>
          <option value="Income">{{ 'transactions.income' | translate }}</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input
            type="checkbox"
            [checked]="splitEnabled"
            (change)="toggleSplit($any($event.target).checked)"
          />
          {{ 'transactions.splitEnable' | translate }}
        </label>
      </div>

      @if (!splitEnabled) {
        <div class="form-group">
          <label for="category">{{ 'transactions.category' | translate }}</label>
          <select id="category" formControlName="categoryId">
            <option [ngValue]="null">{{ 'transactions.selectCategory' | translate }}</option>
            <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
          </select>
        </div>
      } @else {
        <div class="split-section" formArrayName="splits">
          <div class="split-header">
            <h3>{{ 'transactions.splitLines' | translate }}</h3>
            <button type="button" class="btn btn-secondary btn-sm" (click)="addSplitLine()">
              {{ 'transactions.splitAddLine' | translate }}
            </button>
          </div>
          @for (line of splits.controls; track $index) {
            <div class="split-line" [formGroupName]="$index">
              <input
                type="number"
                formControlName="amount"
                step="0.01"
                [placeholder]="'transactions.amount' | translate"
              />
              <select formControlName="categoryId">
                <option [ngValue]="null">{{ 'transactions.selectCategory' | translate }}</option>
                <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
              </select>
              <input
                type="text"
                formControlName="note"
                [placeholder]="'transactions.splitNote' | translate"
              />
              <button type="button" class="btn btn-ghost btn-sm" (click)="removeSplitLine($index)">
                ×
              </button>
            </div>
          }
          <p class="split-total" [class.invalid]="splitTotalMismatch()">
            {{ 'transactions.splitTotal' | translate }}: {{ splitTotal() | currency: 'EUR' }} /
            {{ transactionForm.get('amount')?.value | currency: 'EUR' }}
          </p>
        </div>
      }

      <div class="form-group">
        <label for="contract">{{ 'transactions.contractOptional' | translate }}</label>
        <select id="contract" formControlName="contractId">
          <option [ngValue]="null">— {{ 'common.none' | translate }} —</option>
          <option *ngFor="let c of contracts" [ngValue]="c.id">
            {{ c.name }} ({{ c.amount | currency: 'EUR' }}/{{ c.contractInterval }})
          </option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          {{ 'transactions.cancel' | translate }}
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="transactionForm.invalid">
          {{ 'transactions.save' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
