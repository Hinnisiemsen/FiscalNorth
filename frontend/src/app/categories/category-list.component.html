<div class="page-content-inner">
  <app-page-header heading="Categories">
    <a routerLink="/categories/new" class="btn btn-primary">Add Category</a>
  </app-page-header>

  <div class="list-card" *ngFor="let cat of categories">
    <div class="list-card-body">
      <div class="list-card-title">{{ cat.name }}</div>
      <span
        class="type-badge"
        [class.expense]="cat.transactionType === 'Expense'"
        [class.income]="cat.transactionType === 'Income'"
      >
        {{ cat.transactionType }}
      </span>
    </div>
    <button class="btn-danger" type="button" (click)="deleteCategory(cat.id)">Delete</button>
  </div>

  <div class="empty-state" *ngIf="categories.length === 0">
    <p>No categories yet. Create one to categorize your transactions.</p>
  </div>
</div>
