<div class="paywall-banner">
  <div class="paywall-content">
    <span class="material-symbols-outlined paywall-icon" aria-hidden="true">workspace_premium</span>
    <div>
      <h3>{{ 'billing.paywall.title' | translate }}</h3>
      <p>{{ messageKey | translate }}</p>
    </div>
  </div>
  <div class="paywall-actions">
    @if (showTryDemo) {
      <button type="button" class="btn-secondary paywall-cta" (click)="tryDemo()">
        {{ 'billing.tryInDemo' | translate }}
      </button>
    }
    <a routerLink="/account/upgrade" class="btn-primary paywall-cta">
      {{ 'billing.upgradeCta' | translate }}
    </a>
  </div>
</div>
