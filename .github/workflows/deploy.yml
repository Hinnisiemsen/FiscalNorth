name: Deploy

# Runs after Docker Build succeeds on master, or manually from the Actions tab.
# Requires GCE VM setup in docs/DEPLOY.md and DEPLOY_ENABLED=true.

on:
  workflow_run:
    workflows: [Docker Build]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud (GCE)
    runs-on: ubuntu-latest
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'))
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/fiscalnorth"
            fi
            cd "$DEPLOY_PATH"
            git fetch origin master
            git reset --hard origin/master
            chmod +x scripts/deploy.sh
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            fi
            ./scripts/deploy.sh
            if [ -n "${{ secrets.DEPLOY_URL }}" ]; then
              curl -sf "${{ secrets.DEPLOY_URL }}/api/auth/status" | grep -q '"authenticated"'
              echo "Post-deploy smoke check passed."
            fi
