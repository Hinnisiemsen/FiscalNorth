spring.application.name=fiscalnorth
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.config.import=optional:classpath:application-local.properties

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:fiscalnorth
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Disable Docker Compose for MVP (using H2)
spring.docker.compose.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.mistralai.autoconfigure.MistralAiChatAutoConfiguration,org.springframework.ai.model.mistralai.autoconfigure.MistralAiEmbeddingAutoConfiguration,org.springframework.ai.model.mistralai.autoconfigure.MistralAiModerationAutoConfiguration

# Google Gemini (set GEMINI_API_KEY env or application-local.properties)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
app.ai.enabled=${AI_ENABLED:true}

# XS2A / finAPI Bank Sync (Berlin Group PSD2)
# Enable when you have finAPI sandbox/production credentials
app.xs2a.enabled=false
app.xs2a.base-url=https://xs2a-sandbox.finapi.io
# app.xs2a.access-token=your-oauth-bearer-token
app.xs2a.psu-id=default-user
# Redirect URI after bank SCA (must be whitelisted in finAPI)
app.xs2a.redirect-uri=http://localhost:4200/bank-sync/callback
